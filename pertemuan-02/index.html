<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Manajemen</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Style Logo Kotak Segitiga Merah */
        .brand-icon {
            width: 44px;
            height: 44px;
            background-color: #0e417e;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* Input Form Style */
        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
        }

        .form-control:focus {
            background-color: #fff;
            box-shadow: none;
            border-color: #6c757d;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border-color: #ced4da;
            border-radius: 4px;
        }

        /* Tombol Masuk */
        .btn-login {
            background-color: #1B82FB;
            border: 1px solid #ced4da;
            color: #ffffff;
            font-weight: 500;
            padding: 0.6rem;
            border-radius: 4px;
            transition: all 0.2s ease-in-out;
        }


        .btn-login:hover {
            background-color: #0C4383;
            border-color: #adb5bd;
            color: #ffffff;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar Atas -->
    <header class="py-3 px-4 px-md-5">
        <div class="d-flex justify-content-end align-items-center gap-4 text-secondary small">
            <a href="dashboard.html" class="text-blue fw-bold text-decoration-none">Masuk</a>
            <a href="#" class="text-secondary text-decoration-none">Register</a>
            <div class="dropdown">
                <a class="text-secondary text-decoration-none dropdown-toggle" href="#" role="button"
                    data-bs-toggle="dropdown">
                    Bahasa Indonesia
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                    <li><a class="dropdown-item small" href="#">Bahasa Indonesia</a></li>
                    <li><a class="dropdown-item small" href="#">English</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="container my-auto py-4">
        <div class="row align-items-center justify-content-between g-5">

            <!-- Sisi Kiri: Logo, Judul & Ilustrasi -->
            <div class="col-lg-6">
                <!-- Logo & Header Teks -->
                <div class="d-flex align-items-center gap-3 mb-5">
                    <div class="brand-icon">
                        R
                    </div>
                    <div>
                        <h4 class="mb-0 fw-bold text-secondary">Selamat Datang</h4>
                        <span class="text-muted small">Sistem Informasi Manajemen</span>
                    </div>
                </div>

                <!-- Ilustrasi -->
                <div class="text-center text-lg-start">
                    <img src="org.jpg" alt="Ilustrasi Kerja" class="img-fluid" style="max-height: 320px;"
                        onerror="this.src='https://cdni.iconscout.com/illustration/premium/thumb/office-coworking-space-illustration-download-in-svg-png-gif-file-formats--meeting-team-discussion-business-activity-pack-illustrations-3798675.png';">
                </div>
            </div>

            <!-- Sisi Kanan: Form Login -->
            <div class="col-lg-5 col-xl-4 offset-lg-1">
                <form>
                    <!-- Akun Anda -->
                    <div class="mb-3">
                        <label for="akun" class="form-label text-secondary small mb-1">Akun Anda</label>
                        <input type="text" class="form-control" id="akun" value="ramlidanil57@gmail.com" required>
                    </div>

                    <!-- Kata Sandi -->
                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small mb-1">Kata Sandi</label>
                        <div class="input-group">
                            <input type="password" class="form-control border-end-0" id="password" value="123456"
                                required>
                            <button class="btn input-group-text border-start-0 text-muted" type="button"
                                id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Tombol Masuk -->
                    <div class="d-grid mt-4">
                        <a href="dashboard.html" class="btn btn-login shadow-sm">Masuk</a>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Fitur Show/Hide Password -->
    <script>
        const toggleBtn = document.getElementById('togglePassword');
        const pwdInput = document.getElementById('password');

        toggleBtn.addEventListener('click', function () {
            const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
            pwdInput.setAttribute('type', type);

            const icon = this.querySelector('i');
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>

</html>
