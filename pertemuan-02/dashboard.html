<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar Bootstrap</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background-color: #8dc1fd;
            /* Latar belakang gradien/biru muda seperti di gambar */
        }

        /* Gaya Sidebar */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #1b82fb;
            /* Warna gelap */
            transition: all 0.3s ease-in-out;
        }

        /* Menu Link */
        .sidebar .nav-link {
            color: #bbdafe;
            font-size: 0.95rem;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        /* Hover Menu */
        .sidebar .nav-link:hover {
            color: #e8f3ff;
            background-color: #0b3464;
        }

        /* Menu Aktif (Biru) */
        .sidebar .nav-link.active {
            color: #e8f3ff;
            background-color: #0b3464;
        }

        /* Ukuran Ikon */
        .sidebar .nav-link i {
            font-size: 1.2rem;
            min-width: 24px;
            text-align: center;
        }

        /* State saat Sidebar Menciut (Collapsed / Mini) */
        .sidebar.collapsed {
            width: 75px;
        }

        /* Sembunyikan teks saat collapsed */
        .sidebar.collapsed .link-text,
        .sidebar.collapsed .brand-text {
            display: none;
        }

        .sidebar.collapsed .nav-link {
            justify-content: center;
            padding: 0.75rem 0;
        }

        .sidebar.collapsed .nav-link i {
            margin: 0;
        }
    </style>
</head>

<body class="d-flex">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar d-flex flex-column p-3">
        <!-- Header Sidebar (Logo & Nama) -->
        <a href="#" class="d-flex align-items-center gap-2 mb-4 text-white text-decoration-none px-2">
            <!-- Icon Logo -->
            <i class="bi bi-discord fs-3"></i>
            <span class="fs-5 fw-semibold brand-text">Sidebar</span>
        </a>

        <!-- Garis Pemisah (Opsional) -->
        <hr class="text-secondary my-1">

        <!-- Daftar Menu -->
        <ul class="nav nav-pills flex-column mb-auto mt-3 gap-1">
            <li class="nav-item">
                <a href="#" class="nav-link active">
                    <i class="bi bi-house-door-fill"></i>
                    <span class="link-text">Home</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="bi bi-speedometer2"></i>
                    <span class="link-text">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="bi bi-table"></i>
                    <span class="link-text">Orders</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i class="bi bi-grid-3x3-gap-fill"></i>
                    <span class="link-text">Products</span>
                </a>
            </li>
            <li>
                <a href="index.html" class="nav-link">
                    <i class="bi bi-person-circle"></i>
                    <span class="link-text">Sign In/ Sign Out</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Konten Utama (Main Content) -->
    <main class="flex-grow-1 p-4">
        <!-- Tombol Toggle Sidebar -->
        <button class="btn btn-dark shadow-sm mb-4" id="toggleBtn">
            <i class="bi bi-list"></i> Toggle Sidebar
        </button>

        <div class="card border-0 shadow-sm p-4 rounded-4">
            <h3>Halaman Utama</h3>
            <p class="text-muted">Klik tombol "Toggle Sidebar" di atas untuk beralih antara tampilan sidebar penuh dan
                mode ikon saja.</p>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Toggle Sidebar -->
    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
    </script>
</body>

</html>
